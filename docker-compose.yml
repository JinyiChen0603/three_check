name: ${PROJECT:-mathtasks}

services:
  # PostgreSQL 数据库
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mathtasks}
      POSTGRES_USER: ${POSTGRES_USER:-mathtasks}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mathtasks123}
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mathtasks}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mathtasks_network

  # MongoDB 数据库（用于存储题目内容）
  mongodb:
    image: mongo:7.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_ROOT_PASSWORD:-mongodb123}
    volumes:
      - mongodb_data:/data/db
    ports:
      - "${MONGODB_PORT:-27017}:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mathtasks_network

  # Redis（用于缓存和进度追踪）
  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mathtasks_network
    restart: unless-stopped

  # FastAPI 应用
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      # 数据库连接（使用环境变量）
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-mathtasks}:${POSTGRES_PASSWORD:-mathtasks123}@postgres:5432/${POSTGRES_DB:-mathtasks}
      MONGODB_URL: mongodb://${MONGODB_ROOT_USERNAME:-admin}:${MONGODB_ROOT_PASSWORD:-mongodb123}@mongodb:27017/?authSource=admin
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      INSTANCE_NAME: ${INSTANCE_NAME:-development}
      # 如果没有 .env 文件，使用默认值
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-me}
      DEBUG: ${DEBUG:-true}
      # AI API Keys（从 .env 文件或环境变量读取）
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      CANOPY_WAVE_API_KEY: ${CANOPY_WAVE_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ZHIPU_API_KEY: ${ZHIPU_API_KEY}
      DOUBAO_API_KEY: ${DOUBAO_API_KEY}
      # 业务配置
      PROBLEM_REWARD: ${PROBLEM_REWARD:-50.0}
      REVIEW_REWARD: ${REVIEW_REWARD:-10.0}
    ports:
      - "${API_PORT:-8001}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    networks:
      - mathtasks_network
    restart: unless-stopped
    volumes:
      # 挂载代码目录以便热重载（开发模式）
      - ./backend:/app
      - /app/__pycache__

  # 前端（生产/预发风格）：Nginx 托管静态文件，并反代 /api -> api:8000
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      - api
    networks:
      - mathtasks_network

  # pgAdmin (可选，用于数据库管理)
  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@mathtasks.com
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      - postgres
    networks:
      - mathtasks_network
    profiles:
      - dev

volumes:
  postgres_data:
  mongodb_data:
  redis_data:

networks:
  mathtasks_network:
    driver: bridge
