name: mathtasks

services:
  # PostgreSQL 数据库
  postgres:
    image: postgres:16-alpine
    container_name: mathtasks-db
    environment:
      POSTGRES_DB: mathtasks
      POSTGRES_USER: mathtasks
      POSTGRES_PASSWORD: mathtasks123
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mathtasks"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mathtasks-network

  # MongoDB 数据库（用于存储题目内容）
  mongodb:
    image: mongo:7.0
    container_name: mathtasks-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: mongodb123
    volumes:
      - mongodb_data:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mathtasks-network

  # Redis（用于缓存和进度追踪）
  redis:
    image: redis:7-alpine
    container_name: mathtasks-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mathtasks-network
    restart: unless-stopped

  # FastAPI 应用
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mathtasks-api
    env_file:
      - .env
    environment:
      # 数据库连接（覆盖 .env 中的配置）
      DATABASE_URL: postgresql+asyncpg://mathtasks:mathtasks123@postgres:5432/mathtasks
      MONGODB_URL: mongodb://admin:mongodb123@mongodb:27017/?authSource=admin
      REDIS_URL: redis://redis:6379/0
      # 如果没有 .env 文件，使用默认值
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-me}
      DEBUG: ${DEBUG:-true}
    volumes:
      # 注释掉开发用的卷挂载，避免 Windows 行尾符问题
      # - .:/app
      - /app/__pycache__
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mathtasks-network
    restart: unless-stopped

  # pgAdmin (可选，用于数据库管理)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: mathtasks-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@mathtasks.com
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - mathtasks-network
    profiles:
      - dev

volumes:
  postgres_data:
  mongodb_data:
  redis_data:

networks:
  mathtasks-network:
    driver: bridge

